name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            lld

      - name: Test server
        run: cargo test -p legalminds-server
