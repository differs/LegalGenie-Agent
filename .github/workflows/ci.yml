name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install desktop system deps
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            xdotool \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            lld

      - name: Test server
        run: cargo test -p legalminds-server

      - name: Build frontend (wasm)
        run: cargo build -p legalminds-frontend --target wasm32-unknown-unknown

      - name: Build frontend (desktop)
        run: cargo build -p legalminds-frontend --no-default-features --features desktop
