services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: "${PG_USER:-legalgenie}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:-legalgenie_dev}"
      POSTGRES_DB: "${PG_DB:-legalgenie}"
    ports:
      - "5432:5432"
    volumes:
      - legalgenie-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-legalgenie} -d ${PG_DB:-legalgenie}"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-development}"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      JWT_SECRET: "${JWT_SECRET:-change-me-to-a-long-random-secret}"
      MAX_FILE_SIZE: "${MAX_FILE_SIZE:-104857600}"
      ALLOWED_FILE_TYPES: "${ALLOWED_FILE_TYPES:-pdf,doc,docx,xls,xlsx,jpg,jpeg,png,mp3,wav,txt,json}"
      ASR_LANGUAGE: "${ASR_LANGUAGE:-zh}"
      ASR_THREADS: "${ASR_THREADS:-4}"
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"
      DATABASE_URL: "postgres://${PG_USER:-legalgenie}:${PG_PASSWORD:-legalgenie_dev}@postgres:5432/${PG_DB:-legalgenie}"
      STORAGE_PATH: "./storage"
      TEMP_PATH: "./storage/temp"
      TESSDATA_DIR: "./data/tessdata"
      WHISPER_MODEL_PATH: "./data/models/whisper/ggml-tiny.bin"
      WORKER_ONLY: "1"
      JOB_WORKERS: "${JOB_WORKERS:-4}"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: "${APP_ENV:-development}"
      FORCE_HTTPS: "${FORCE_HTTPS:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"

      JWT_SECRET: "${JWT_SECRET:-change-me-to-a-long-random-secret}"
      ACCESS_TOKEN_EXPIRE_MINUTES: "${ACCESS_TOKEN_EXPIRE_MINUTES:-60}"
      REFRESH_TOKEN_EXPIRE_DAYS: "${REFRESH_TOKEN_EXPIRE_DAYS:-7}"

      MAX_FILE_SIZE: "${MAX_FILE_SIZE:-104857600}"
      ALLOWED_FILE_TYPES: "${ALLOWED_FILE_TYPES:-pdf,doc,docx,xls,xlsx,jpg,jpeg,png,mp3,wav,txt,json}"

      ASR_LANGUAGE: "${ASR_LANGUAGE:-zh}"
      ASR_THREADS: "${ASR_THREADS:-4}"

      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8000"

      DATABASE_URL: "postgres://${PG_USER:-legalgenie}:${PG_PASSWORD:-legalgenie_dev}@postgres:5432/${PG_DB:-legalgenie}"
      STORAGE_PATH: "./storage"
      TEMP_PATH: "./storage/temp"
      TESSDATA_DIR: "./data/tessdata"
      WHISPER_MODEL_PATH: "./data/models/whisper/ggml-tiny.bin"
    volumes:
      - ./storage:/app/storage

volumes:
  legalgenie-pg-data:
