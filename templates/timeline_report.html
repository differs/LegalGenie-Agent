<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{title}}</title>
    <style>
      body {
        font-family: "Noto Sans CJK SC", "Noto Sans CJK", "DejaVu Sans", sans-serif;
        font-size: 12pt;
        line-height: 1.6;
        color: #111;
        margin: 0;
      }
      .page {
        padding: 24px;
      }
      h1 {
        font-size: 22pt;
        margin: 0 0 8px 0;
        color: #0f172a;
      }
      .meta {
        font-size: 10pt;
        color: #475569;
        margin: 0 0 14px 0;
      }
      .meta span {
        margin-right: 12px;
      }
      .timeline {
        width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        margin: 10px 0 18px 0;
      }
      h2 {
        font-size: 14pt;
        margin: 18px 0 10px 0;
        color: #1e293b;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10pt;
      }
      th,
      td {
        border: 1px solid #e2e8f0;
        padding: 6px 8px;
        vertical-align: top;
      }
      th {
        background: #f8fafc;
        color: #0f172a;
        font-weight: 700;
      }
      tr:nth-child(even) {
        background: #f8fafb;
      }
      .col-date {
        width: 110px;
        white-space: nowrap;
      }
      .col-ev {
        width: 90px;
        white-space: nowrap;
        text-align: right;
      }
      .muted {
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>{{title}}</h1>
      <p class="meta">
        <span>Generated at {{generated_at}}</span>
        <span>Generated by {{generated_by}}</span>
        <span class="muted">{{range}}</span>
        <span>Nodes {{node_count}}</span>
      </p>

      <img class="timeline" src="{{timeline_img_src}}" alt="timeline" />

      <h2>节点列表</h2>
      <table>
        <thead>
          <tr>
            <th class="col-date">日期</th>
            <th>标题</th>
            <th>描述</th>
            <th class="col-ev">证据数</th>
          </tr>
        </thead>
        <tbody>
          {{node_rows}}
        </tbody>
      </table>
    </div>
  </body>
</html>
